name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Set release version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $v = $Matches[1]
            $tag = $env:GITHUB_REF_NAME
          } else {
            $v = "0.1.$env:GITHUB_RUN_NUMBER"
            $tag = "v$v"
          }
          "VERSION=$v" >> $env:GITHUB_OUTPUT
          "TAG=$tag" >> $env:GITHUB_OUTPUT
      - name: Restore
        run: dotnet restore src/FullTV/FullTV.csproj
      - name: Build self-contained Windows executable
        shell: pwsh
        run: |
          dotnet publish src/FullTV/FullTV.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ steps.ver.outputs.VERSION }} -o publish
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Package Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.VERSION }}" "installer\FullTV.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $installer = Get-ChildItem artifacts -Filter '*-Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw "Installer not generated" }
          Rename-Item $installer.FullName 'FullTV-Setup.exe'
          $file = Join-Path (Resolve-Path artifacts) 'FullTV-Setup.exe'
          $sum = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sum  FullTV-Setup.exe" | Set-Content -Encoding ascii "$file.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: FullTV-Windows-installer
          path: artifacts/*
      - name: Publish GitHub Release with direct EXE download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.ver.outputs.TAG }}
          RELEASE_VERSION: ${{ steps.ver.outputs.VERSION }}
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" artifacts/* --target "$env:GITHUB_SHA" --title "FullTV v$env:RELEASE_VERSION" --notes-file CHANGELOG.md --latest
